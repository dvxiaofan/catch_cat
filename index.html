<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="切换主题" title="点击循环：自动 / 亮色 / 暗色">
    <span class="theme-icon">自动</span>
  </button>
  <button id="soundToggle" class="sound-toggle" aria-label="开关音效" title="开关音效">
    <span class="sound-icon">声</span>
  </button>

  <div class="container">
    <header>
      <h1>404</h1>
      <p class="subtitle">您所访问的页面不存在或已删除</p>
      <p class="hint">点击小圆点，围住小猫</p>
    </header>

    <main>
      <canvas id="gameCanvas"></canvas>
      <div id="message" class="message"></div>
    </main>

    <footer>
      <button id="undoBtn" class="undo-btn" disabled>撤销</button>
      <button id="resetBtn" class="reset-btn">重新开始</button>
    </footer>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
